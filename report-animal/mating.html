<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mating Facilities Map - Jivsahayy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="../components/maps/facility-map.css">
</head>
<body>
    <div id="facility-map-app"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="../components/maps/facilities-data.js"></script>
    <script src="../components/maps/facility-map.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var params = new URLSearchParams(window.location.search);
            var filter = params.get("filter");
            var filterLabels = {
                cat: "Cat Breeding & Mating Centers",
                dog: "Dog Breeding & Mating Centers",
                other: "Other Animal Mating Centers"
            };
            var config = Object.assign({}, FACILITY_MAP_CONFIGS.mating, {
                assetPrefix: "../",
                backLink: "../matting.html",
                filterType: filter,
                title: filterLabels[filter] || FACILITY_MAP_CONFIGS.mating.title,
                subtitle: filter
                    ? "Showing registered breeding centers for " + filter + " matchmaking."
                    : FACILITY_MAP_CONFIGS.mating.subtitle
            });
            FacilityMap.initPage(config);
        });
    </script>
<script src="../components/pawconnect/pawconnect.js"></script>
</body>
</html>
