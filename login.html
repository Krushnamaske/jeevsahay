<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jivsahayy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: #f5efe6;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .fs-4 {
            font-weight: 1000;
            font-size: 50px;
            font-family: cursive;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #efe4d2;
            border-radius: 18px;
            border: none;
            max-width: 440px;
            width: 100%;
            padding: 40px 36px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 28px;
            font-size: 15px;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px 14px;
            border: 1px solid #d8cdb8;
            background: #fffdf9;
        }

        .form-control:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 0.2rem rgba(46, 125, 50, 0.15);
        }

        .input-group .form-control {
            border-radius: 10px 0 0 10px;
        }

        .input-group .btn-toggle-pass {
            border-radius: 0 10px 10px 0;
            border: 1px solid #d8cdb8;
            background: #fffdf9;
            border-left: none;
            color: #555;
        }

        .btn-jeev {
            background: #2e7d32;
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-weight: 600;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .btn-jeev:hover {
            background: #25642a;
            transform: translateY(-1px);
        }

        .btn-jeev:disabled {
            opacity: 0.7;
            transform: none;
        }

        .form-text-link {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }

        .form-text-link:hover {
            text-decoration: underline;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin: 4px 0 18px;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }

        #toastBox {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .field-error {
            color: #c0392b;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 24px;
            color: #2e7d32;
            font-weight: 600;
            text-decoration: none;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        @media (max-width: 425px) {
            .auth-card {
                padding: 28px 20px;
            }

            .fs-4 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <a href="/homepage.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>

    <div id="toastBox"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="fs-4" style="color:#1b5e20;">Jivsahayy</span>
            </div>
            <p class="auth-subtitle">Welcome back! Log in to continue helping animals in need.</p>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                    <div class="field-error" id="emailError">Please enter a valid email address.</div>
                </div>

                <div class="mb-2">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="Your password" required minlength="8">
                        <button type="button" class="btn btn-toggle-pass" id="togglePassword"><i class="fa-solid fa-eye"></i></button>
                    </div>
                    <div class="field-error" id="passwordError">Password must be at least 8 characters.</div>
                </div>

                <div class="top-row">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" checked>
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="/forgot-password.html" class="form-text-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-jeev w-100 text-white" id="loginBtn">
                    <span id="loginBtnText">Log In</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                </button>

                <p class="text-center mt-4 mb-0" style="font-size:14px;">
                    Don't have an account? <a href="/signup.html" class="form-text-link">Sign up</a>
                </p>
            </form>
        </div>
    </div>

    <script src="/public/js/auth.js"></script>
    <script>
        // If already logged in, skip straight past the login page.
        if (JeevAuth.isLoggedIn()) {
            JeevAuth.redirectByRole(JeevAuth.getUser());
        }

        function showToast(message, type = 'danger') {
            const box = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0 show mb-2`;
            toast.style.minWidth = '260px';
            toast.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button></div>`;
            box.appendChild(toast);
            setTimeout(() => toast.remove(), 4500);
        }

        document.getElementById('togglePassword').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        const emailEl = document.getElementById('email');
        const passwordEl = document.getElementById('password');

        function validate() {
            let ok = true;
            const emailValid = /^\S+@\S+\.\S+$/.test(emailEl.value.trim());
            document.getElementById('emailError').style.display = emailValid ? 'none' : 'block';
            if (!emailValid) ok = false;

            const passValid = passwordEl.value.length >= 8;
            document.getElementById('passwordError').style.display = passValid ? 'none' : 'block';
            if (!passValid) ok = false;

            return ok;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!validate()) return;

            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            btn.disabled = true;
            btnText.textContent = 'Logging in...';
            spinner.classList.remove('d-none');

            try {
                const remember = document.getElementById('remember').checked;
                const user = await JeevAuth.login(emailEl.value.trim(), passwordEl.value, remember);
                showToast('Logged in successfully! Redirecting...', 'success');
                setTimeout(() => JeevAuth.redirectByRole(user), 700);
            } catch (err) {
                showToast(err.message || 'Login failed. Please try again.', 'danger');
                btn.disabled = false;
                btnText.textContent = 'Log In';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>

</html>
