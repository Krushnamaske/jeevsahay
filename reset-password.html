<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Jivsahayy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #f5efe6; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .fs-4 { font-weight: 1000; font-size: 50px; font-family: cursive; }
        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #efe4d2; border-radius: 18px; max-width: 440px; width: 100%; padding: 40px 36px; box-shadow: 0 6px 24px rgba(0,0,0,0.1); }
        .auth-subtitle { text-align: center; color: #555; margin-bottom: 26px; font-size: 15px; }
        .form-control { border-radius: 10px; padding: 11px 14px; border: 1px solid #d8cdb8; background: #fffdf9; }
        .form-control:focus { border-color: #2e7d32; box-shadow: 0 0 0 0.2rem rgba(46,125,50,0.15); }
        .btn-jeev { background: #2e7d32; border: none; border-radius: 10px; padding: 11px; font-weight: 600; }
        .btn-jeev:hover { background: #25642a; }
        #toastBox { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .field-error { color: #c0392b; font-size: 13px; margin-top: 4px; display: none; }
        .input-group .btn-toggle-pass { border-radius: 0 10px 10px 0; border: 1px solid #d8cdb8; background: #fffdf9; border-left: none; color: #555; }
    </style>
</head>

<body>
    <div id="toastBox"></div>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center"><span class="fs-4" style="color:#1b5e20;">Jivsahayy</span></div>
            <p class="auth-subtitle">Choose a new password for your account.</p>

            <form id="resetForm" novalidate>
                <label class="form-label">New Password</label>
                <div class="input-group mb-3">
                    <input type="password" class="form-control" id="password" minlength="8" required>
                    <button type="button" class="btn btn-toggle-pass toggle-pass-btn" data-target="password"><i class="fa-solid fa-eye"></i></button>
                </div>

                <label class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
                    <button type="button" class="btn btn-toggle-pass toggle-pass-btn" data-target="confirmPassword"><i class="fa-solid fa-eye"></i></button>
                </div>
                <div class="field-error" id="matchError">Passwords do not match (min. 8 characters).</div>

                <button type="submit" class="btn btn-jeev w-100 text-white mt-4" id="submitBtn">
                    <span id="submitBtnText">Reset Password</span>
                    <span id="submitSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="/public/js/auth.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');

        function showToast(message, type = 'success') {
            const box = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0 show mb-2`;
            toast.style.minWidth = '260px';
            toast.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button></div>`;
            box.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        if (!token) {
            showToast('This reset link is missing its token. Please request a new one.', 'danger');
        }

        document.querySelectorAll('.toggle-pass-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('i');
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            });
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const valid = password.length >= 8 && password === confirmPassword;
            document.getElementById('matchError').style.display = valid ? 'none' : 'block';
            if (!valid || !token) return;

            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('submitBtnText');
            const spinner = document.getElementById('submitSpinner');
            btn.disabled = true;
            btnText.textContent = 'Resetting...';
            spinner.classList.remove('d-none');

            try {
                const res = await fetch(`/api/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, confirmPassword }),
                    credentials: 'include',
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Something went wrong.');

                JeevAuth.saveSession(data.token, data.user);
                showToast('Password reset! Redirecting...', 'success');
                setTimeout(() => JeevAuth.redirectByRole(data.user), 700);
            } catch (err) {
                showToast(err.message, 'danger');
                btn.disabled = false;
                btnText.textContent = 'Reset Password';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>

</html>
