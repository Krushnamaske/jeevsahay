<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Jivsahayy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #f5efe6; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .fs-4 { font-weight: 1000; font-size: 50px; font-family: cursive; }
        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #efe4d2; border-radius: 18px; max-width: 440px; width: 100%; padding: 40px 36px; box-shadow: 0 6px 24px rgba(0,0,0,0.1); }
        .auth-subtitle { text-align: center; color: #555; margin-bottom: 26px; font-size: 15px; }
        .form-control { border-radius: 10px; padding: 11px 14px; border: 1px solid #d8cdb8; background: #fffdf9; }
        .form-control:focus { border-color: #2e7d32; box-shadow: 0 0 0 0.2rem rgba(46,125,50,0.15); }
        .btn-jeev { background: #2e7d32; border: none; border-radius: 10px; padding: 11px; font-weight: 600; }
        .btn-jeev:hover { background: #25642a; }
        .form-text-link { color: #2e7d32; text-decoration: none; font-weight: 600; }
        .form-text-link:hover { text-decoration: underline; }
        #toastBox { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .back-home { position: absolute; top: 20px; left: 24px; color: #2e7d32; font-weight: 600; text-decoration: none; }
        .field-error { color: #c0392b; font-size: 13px; margin-top: 4px; display: none; }
        #devLink { font-size: 13px; background: #fff3cd; border: 1px solid #ffe69c; border-radius: 8px; padding: 10px; margin-top: 16px; display: none; word-break: break-all; }
    </style>
</head>

<body>
    <a href="/login.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
    <div id="toastBox"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center"><span class="fs-4" style="color:#1b5e20;">Jivsahayy</span></div>
            <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

            <form id="forgotForm" novalidate>
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                <div class="field-error" id="emailError">Please enter a valid email address.</div>

                <button type="submit" class="btn btn-jeev w-100 text-white mt-3" id="submitBtn">
                    <span id="submitBtnText">Send Reset Link</span>
                    <span id="submitSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                </button>
            </form>

            <div id="devLink"></div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const box = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0 show mb-2`;
            toast.style.minWidth = '260px';
            toast.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button></div>`;
            box.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailEl = document.getElementById('email');
            const emailValid = /^\S+@\S+\.\S+$/.test(emailEl.value.trim());
            document.getElementById('emailError').style.display = emailValid ? 'none' : 'block';
            if (!emailValid) return;

            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('submitBtnText');
            const spinner = document.getElementById('submitSpinner');
            btn.disabled = true;
            btnText.textContent = 'Sending...';
            spinner.classList.remove('d-none');

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailEl.value.trim() }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Something went wrong.');
                showToast(data.message, 'success');

                if (data.devResetUrl) {
                    const devLink = document.getElementById('devLink');
                    devLink.style.display = 'block';
                    devLink.innerHTML = `<strong>Dev mode:</strong> no email service is configured yet, so here's your reset link directly: <a href="${data.devResetUrl}">${data.devResetUrl}</a>`;
                }
            } catch (err) {
                showToast(err.message, 'danger');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Send Reset Link';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>

</html>
