<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repoert Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>.card-cover {
    height: 220px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;


    background: linear-gradient(135deg, #4CAF50, #2E7D32);


    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);


    transition: all 0.3s ease;
}

.card-cover h3 {
    font-size: 1.5rem;
    font-weight: bold;
}


.card-cover:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
}

/* Common card styling */
.card-cover {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    color: white;
    font-weight: bold;
}


.card-cover::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5); /* dark overlay */
    z-index: 1;
}
.card-cover h3 {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 24px;
}
/* img behinde cards */

.animal-card .card-cover {
    background: url('image\ copy.png') center/cover no-repeat;
}

.farmer-card .card-cover {
    background: url('image\ copy\ 2.png') center/cover no-repeat;
}

.matting-card .card-cover {
    background: url('image\ copy\ 3.png') center/cover no-repeat;
}

.wildlife-card .card-cover {
    background: url('image\ copy\ 4.png') center/cover no-repeat;
}</style>
</head>

<body>

    <div class="container py-5">
    <div class="row g-4 justify-content-center">

        <div class="col-12 col-md-6 animal-card">
            <div class="card card-cover text-white" id="animalCard" style="cursor:pointer;">
                <h3>Animal Rescue</h3>
            </div>
        </div>

        <div class="col-12 col-md-6 farmer-card">
            <div class="card card-cover text-white" id="farmerCard" style="cursor:pointer;">
                <h3>Farmers</h3>
            </div>
        </div>

        <div class="col-12 col-md-6 matting-card">
            <div class="card card-cover text-white" id="mattingCard" style="cursor:pointer;">
                <h3>Breeding Support Module</h3>
            </div>
        </div>

        <div class="col-12 col-md-6 wildlife-card">
            <div class="card card-cover text-white" id="wildlifeCard" style="cursor:pointer;">
                <h3>Wildlife Rescue</h3>
            </div>
        </div>

    </div>
</div>


</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="./components/pawconnect/pawconnect.js"></script>
<script>
document.getElementById("animalCard").addEventListener("click", function () {
    window.location.href = "./animal_rescue.html";
});

document.getElementById("farmerCard").addEventListener("click", function () {
    window.location.href = "./farmers.html";
});

document.getElementById("mattingCard").addEventListener("click", function () {
    window.location.href = "./matting.html";
});

document.getElementById("wildlifeCard").addEventListener("click", function () {
    window.location.href = "./wildlife.html";
});
</script>
</body>

</html>
